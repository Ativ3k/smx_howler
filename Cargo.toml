[package]
name = "smx_howler"
version = "0.1.0"
edition = "2021"
description = "Battery, DPI, polling, lighting, button remapping and Discord helpers for the SMX Howler (Sinowealth 258A:002E/002F)"
license = "MIT"
rust-version = "1.95"

[features]
# Keep the console subsystem in release builds so the --list/--battery CLI
# modes can print. Without this feature release builds are pure GUI apps.
console = []

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
hidapi = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
